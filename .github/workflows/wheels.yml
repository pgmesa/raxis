name: Wheels

# Pushing a version tag releases it: the wheels are built and tested, then
# uploaded to PyPI and to a GitHub release whose notes are the tag's message
# followed by the commits since the previous tag:
#
#   git tag -a v0.2.0 -F notes.md && git push origin v0.2.0
#
# Manual runs only build and test the wheels.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      os:
        description: Runners to build on, as a JSON list (manual runs only)
        default: '["windows-2022", "ubuntu-24.04", "ubuntu-24.04-arm", "macos-14"]'
      build:
        description: Wheels to build, as CIBW_BUILD (empty builds every Python version)
        default: ""

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7

      - id: validate
        uses: pgmesa/actions/validate-tag@validate-tag/v1.1.0
        with:
          tag: ${{ github.ref_name }}
          version-file: raxis/__init__.py

  build:
    name: ${{ matrix.os }}
    needs: validate
    # validate is skipped on manual runs
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # A tag builds on every runner (inputs.os is empty on push)
        os: ${{ fromJSON(inputs.os || '["windows-2022", "ubuntu-24.04", "ubuntu-24.04-arm", "macos-14"]') }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Set only when given: an empty CIBW_BUILD means "*", not the list in
      # pyproject.toml
      - if: inputs.build
        shell: bash
        env:
          BUILD: ${{ inputs.build }}
        run: echo "CIBW_BUILD=${BUILD}" >> "$GITHUB_ENV"

      # Configured in [tool.cibuildwheel] in pyproject.toml. Each wheel is
      # tested right after it is built, and the first failure stops the run
      - uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish
    needs: [validate, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write  # create the release
      id-token: write  # PyPI trusted publishing
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # git-cliff needs the history and the tags

      # The checkout of a tag can leave it as a lightweight tag, without the
      # message that becomes the intro of the release notes
      - run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Check the wheels
        run: |
          ls -l dist
          if ls dist/*.whl | grep -v "/raxis-${VERSION}-"; then
            echo "::error::Wheels whose version is not ${VERSION}"
            exit 1
          fi

      # skip-existing lets a re-run finish a release whose upload succeeded
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      # A pre-release lists the commits since the previous tag; a stable
      # release, everything since the previous stable one. The args are split
      # into words unquoted, hence \d instead of a [0-9] glob
      - id: notes
        uses: pgmesa/actions/git-cliff@git-cliff/v1.1.0
        with:
          args: >-
            --current --strip header
            ${{ needs.validate.outputs.prerelease == 'false' && '--tag-pattern ^v\d+\.\d+\.\d+$' || '' }}

      # The tag was pushed by hand: GITHUB_TOKEN cannot create it
      - name: Create the GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.whl
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file "${{ steps.notes.outputs.file }}"
          ${{ needs.validate.outputs.prerelease == 'true' && '--prerelease' || '' }}
