[package]
name = "raxis"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "raxis"
crate-type = ["rlib", "cdylib"]

[[example]]
name = "playground"
path = "examples/playground.rs"

[dependencies]
numpy = "0.27.1"
pyo3 = { version = "0.27.0", optional = true }

[features]
default = []
python = ["pyo3"]  # Enable Python bindings with --features python
