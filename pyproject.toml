[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raxis"
dynamic = ["version"]
description = "A readable re-implementation of the core of PyTorch (ATen tensor library + autograd) in C++20, with Python bindings."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
urls = {Homepage = "https://github.com/pgmesa/raxis"}
keywords = ["Tensor", "Autograd", "Deep Learning", "PyTorch", "ATen", "C++", "SIMD"]
authors = [
    {name = "Pablo García Mesa", email = "pgmesa.sm@gmail.com"}
]

classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",

    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",

    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
build = [
    "pybind11>=2.13.0,<3.0.0",
    "pybind11-stubgen>=2.5.0,<3.0.0",
    "mkl-devel>=2025.0; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "mkl-static>=2025.0; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "intel-openmp>=2025.0; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
]
test = [
    "pytest>=8.0.0,<9.0.0",
    "numpy>=2.0.0,<3.0.0",
]
examples = [
    "numpy>=2.0.0,<3.0.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
    "ipywidgets>=8.0.0",
    "ipykernel>=6.0.0",
]
dev = [
    "raxis[build]",
    "raxis[test]",
    "raxis[examples]",
]
# PyTorch is the reference for tests and examples: pick one build with
# `--extra cpu` or `--extra cu130`
cpu = [
    "torch>=2.0.0,<3.0.0",
    "torchvision>=0.15.0",
]
cu130 = [
    "torch>=2.0.0,<3.0.0",
    "torchvision>=0.15.0",
]

[tool.setuptools]
packages = { find = { where = ["."], include = ["raxis", "raxis.*"]} }
package-data = { "raxis.lib" = ["**/*"], "raxis" = ["include/**/*", "share/**/*", "_C/*.pyi"] }

[tool.setuptools.dynamic]
version = {attr = "raxis.__version__"}

[tool.test]
framework = "pytest"

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
# libraxis is built with CMake for each Python version, then setuptools only
# packages it (see setup.py)
before-build = [
    "pip install \"pybind11>=2.13.0,<3.0.0\" \"pybind11-stubgen>=2.5.0,<3.0.0\" mkl-devel mkl-static intel-openmp",
    "python {project}/scripts/build_libraxis.py",
]
test-requires = ["pytest", "numpy", "torch"]
test-command = "pytest {project}/tests -q -x"
# PyTorch's CPU wheels (PyPI's Linux wheels pull the CUDA libraries)
test-environment = { PIP_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cpu" }

[tool.cibuildwheel.linux]
archs = ["x86_64"]
# libiomp5.so already ships in raxis/lib, next to libraxis.so (RUNPATH
# $ORIGIN), and raxis/__init__.py loads that copy: a second, renamed copy
# would mean two OpenMP runtimes in the process
repair-wheel-command = "auditwheel repair --exclude libiomp5.so -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# raxis/lib already has every DLL it needs (iomp5 and the MSVC runtime):
# delvewheel would add renamed copies of raxis.dll and libiomp5md.dll
repair-wheel-command = ""
