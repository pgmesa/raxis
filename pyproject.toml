[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raxis"
dynamic = ["version"]
description = "A readable re-implementation of the core of PyTorch (ATen tensor library + autograd) in C++20, with Python bindings."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
urls = {Homepage = "https://github.com/pgmesa/raxis"}
keywords = ["Tensor", "Autograd", "Deep Learning", "PyTorch", "ATen", "C++", "SIMD"]
authors = [
    {name = "Pablo García Mesa", email = "pgmesa.sm@gmail.com"}
]

classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",

    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",

    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
build = [
    "pybind11>=2.13.0,<3.0.0",
    "pybind11-stubgen>=2.5.0,<3.0.0",
    "numpy>=2.0.0,<3.0.0",  # the stubs reference numpy types
    "mkl-devel>=2025.0; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "mkl-static>=2025.0; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "intel-openmp>=2025.0; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
]
test = [
    "pytest>=8.0.0,<9.0.0",
    "numpy>=2.0.0,<3.0.0",
]
examples = [
    "numpy>=2.0.0,<3.0.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
    "ipywidgets>=8.0.0",
    "ipykernel>=6.0.0",
    "tiktoken>=0.8.0",  # GPT-2's BPE for examples/nanogpt
    "certifi>=2026.10.19",  # tiktoken downloads with requests (emSign CA incident fix)
]
viz = [
    "graphviz>=0.20",
]
# The CUDA backend: pip install raxis[cuda12] or raxis[cuda13]. Not pinned:
# each plugin requires the raxis of its own version
cuda12 = ["raxis-cuda12"]
cuda13 = ["raxis-cuda13"]
dev = [
    "raxis[build]",
    "raxis[test]",
    "raxis[examples]",
    "raxis[viz]",
]
# PyTorch is the reference for tests and examples: pick one build with
# `--extra cpu` or `--extra cu130`
cpu = [
    "torch>=2.0.0,<3.0.0",
    "torchvision>=0.15.0",
]
cu130 = [
    "torch>=2.0.0,<3.0.0",
    "torchvision>=0.15.0",
]

[tool.setuptools]
packages = { find = { where = ["."], include = ["raxis", "raxis.*"]} }
package-data = { "raxis.lib" = ["**/*"], "raxis" = ["include/**/*", "share/**/*", "_C/*.pyi", "py.typed"] }

[tool.setuptools.dynamic]
version = {attr = "raxis.__version__"}

[tool.test]
framework = "pytest"

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

# uv locks every extra, and a raxis-cuda* from PyPI requires the raxis of its
# own version, which a development checkout does not match. For the lock the
# plugins come from plugins/cuda, with placeholder metadata so that uv never
# builds them (a source build has libraxis_cuda in raxis/lib instead)
[[tool.uv.dependency-metadata]]
name = "raxis-cuda12"
version = "0.0.0"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "raxis-cuda13"
version = "0.0.0"
requires-dist = []

[tool.uv.sources]
raxis-cuda12 = { path = "plugins/cuda" }
raxis-cuda13 = { path = "plugins/cuda" }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
# libraxis is built with CMake for each Python version, then setuptools only
# packages it (see setup.py)
before-build = [
    "pip install \"pybind11>=2.13.0,<3.0.0\" \"pybind11-stubgen>=2.5.0,<3.0.0\" numpy mkl-devel mkl-static intel-openmp",
    "python {project}/scripts/build_libraxis.py",
]
test-requires = ["pytest", "numpy", "torch"]
test-command = "pytest {project}/tests -q -x"
# PyTorch's CPU wheels (PyPI's Linux wheels pull the CUDA libraries)
test-environment = { PIP_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cpu" }

[tool.cibuildwheel.linux]
# x86_64 on ubuntu-24.04, aarch64 on ubuntu-24.04-arm (no emulation)
archs = ["native"]
# MKL takes ~2.5 GB once installed: install it once per container and share
# it across Python versions (build_libraxis.py reads RAXIS_MKL_PREFIX), or
# the runner runs out of disk
before-all = "/opt/python/cp312-cp312/bin/python -m pip install --prefix /opt/mkl mkl-devel mkl-static intel-openmp"
before-build = [
    "pip install \"pybind11>=2.13.0,<3.0.0\" \"pybind11-stubgen>=2.5.0,<3.0.0\" numpy",
    "python {project}/scripts/build_libraxis.py",
]
environment = { RAXIS_MKL_PREFIX = "/opt/mkl" }
# libiomp5.so already ships in raxis/lib, next to libraxis.so (RUNPATH
# $ORIGIN), and raxis/__init__.py loads that copy: a second, renamed copy
# would mean two OpenMP runtimes in the process
repair-wheel-command = "auditwheel repair --exclude libiomp5.so -w {dest_dir} {wheel}"

# No MKL on ARM: OpenBLAS built with OpenMP, linked statically. auditwheel
# bundles libgomp, as in PyTorch's aarch64 wheels
[[tool.cibuildwheel.overrides]]
select = "*-manylinux_aarch64"
before-all = "bash {project}/scripts/install_openblas.sh /opt/OpenBLAS"
environment = { BLA_VENDOR = "OpenBLAS", CMAKE_PREFIX_PATH = "/opt/OpenBLAS" }
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# raxis/lib already has every DLL it needs (iomp5 and the MSVC runtime):
# delvewheel would add renamed copies of raxis.dll and libiomp5md.dll
repair-wheel-command = ""

[tool.cibuildwheel.macos]
archs = ["arm64"]
# No MKL on ARM: Accelerate ships with macOS. Apple's clang has no OpenMP, so
# libraxis falls back to its native thread pool. 14.0 as PyTorch's macOS
# wheels: the C++20 library needs at least 13.3
before-build = [
    "pip install \"pybind11>=2.13.0,<3.0.0\" \"pybind11-stubgen>=2.5.0,<3.0.0\" numpy",
    "python {project}/scripts/build_libraxis.py",
]
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }
