[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raxis"
dynamic = ["version"]
description = "A Tensor library"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
urls = {Homepage = "https://github.com/pgmesa/raxis"}
keywords = ["Tensor", "Autograd", "C++", "Python", "CUDA"]
authors = [
    {name = "Pablo García Mesa", email = "pgmesa.sm@gmail.com"}
]

classifiers = [
    "Development Status :: 1 - Planning",

    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",

    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",

    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
build = [
    "pybind11>=2.13.0,<3.0.0",
    "pybind11-stubgen>=2.5.0,<3.0.0",
    "mkl-devel>=2025.0; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "mkl-static>=2025.0; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "intel-openmp>=2025.0; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
]
test = [
    "pytest>=8.0.0,<9.0.0",
    "numpy>=2.0.0,<3.0.0",
    "torch>=2.0.0,<3.0.0"
]
examples = [
    "numpy>=2.0.0,<3.0.0",
    "torch>=2.0.0,<3.0.0",
    "torchvision>=0.15.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
    "ipywidgets>=8.0.0",
    "ipykernel>=6.0.0",
]
dev = [
    "raxis[build]",
    "raxis[test]",
    "raxis[examples]",
]

[tool.setuptools]
packages = { find = { where = ["."], include = ["raxis", "raxis.*"]} }
package-data = { "raxis.lib" = ["**/*"], "raxis" = ["include/**/*", "share/**/*"] }

[tool.setuptools.dynamic]
version = {attr = "raxis.__version__"}

[tool.test]
framework = "pytest"

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true