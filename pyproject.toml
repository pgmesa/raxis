[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raxis"
dynamic = ["version"]
description = "A Tensor library"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
urls = {Homepage = "https://github.com/pgmesa/raxis"}
keywords = ["Tensor", "C++", "Python"]
authors = [
    {name = "Pablo García Mesa", email = "pgmesa.sm@gmail.com"}
]

classifiers = [
    "Development Status :: 1 - Planning",

    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",

    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",

    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
build = [
    "pybind11>=2.13.0,<3.0.0",
    "pybind11-stubgen>=2.5.0,<3.0.0",
    "pytest>=8.0.0,<9.0.0",
    "numpy>=1.0.0,<3.0.0",
    #"torch>=2.0.0,<3.0.0"
]

[tool.setuptools]
packages = { find = { where = ["."], include = ["raxis", "raxis.*"]} }
package-data = { "raxis.lib" = ["**/*"], "raxis" = ["include/**/*", "share/**/*"] }

[tool.setuptools.dynamic]
version = {attr = "raxis.__version__"}

[tool.test]
framework = "pytest"